name: BAJ ledger

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.0'
          cache: true
      - name: Verify dependencies, ledger and design
        run: |
          go mod download
          go mod verify
          go test -race ./...
          go vet ./...
          go run ./cmd/bajarcheck network/spec.json
          go test github.com/cometbft/cometbft/crypto/mldsa65
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/review-publication.py
      - name: Build and exercise four local ML-DSA-65 validators
        run: |
          bash scripts/build-ledger.sh
          python3 scripts/ledger-devnet.py e2e
      - name: Test four validators and an RPC node on five isolated networks
        run: sudo python3 scripts/testnet-integration.py
      - name: Validate service template without installation
        run: sudo python3 scripts/check-service.py
      - name: Stop local validators
        if: always()
        run: |
          if [ -f .ledger-devnet/processes.json ]; then
            python3 scripts/ledger-devnet.py stop
          fi
